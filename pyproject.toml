[project]
name = "visual-task-factory"
version = "0.1.0"
description = "Generates image question-answer tasks whose answers are computed and whose validity is machine-checked."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.12.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openai>=2.0",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
vtf = "vtf.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
