name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash  # with -eo pipefail, so a failing test fails the step even when piped to tee

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and Tesseract
        run: |
          python -m pip install "uv==0.11.32"
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr

      - name: Install the locked dependencies
        run: uv sync --locked

      # Includes tests/test_reproducible.py: a fixed run must produce the recorded tasks.
      - name: Tests
        run: uv run pytest -v 2>&1 | tee pytest.log

      # The committed samples must be what the code makes from their seeds: the same tasks, pairs and photos.
      - name: Committed samples regenerate
        run: |
          uv run vtf generate --n 300 --seed 42 --out out/standard | tee generate-standard.log
          uv run vtf pairs out/standard
          uv run vtf photos out/standard
          uv run vtf generate --config configs/charts-hard.yaml --n 150 --seed 7 --out out/hard | tee generate-hard.log
          uv run vtf pairs out/hard
          uv run vtf compare out/standard samples/charts-seed42 | tee samples-match.log
          uv run vtf compare out/hard samples/charts-hard-seed7 | tee -a samples-match.log
          for spec in instruments:300 connections:300 counting:150; do
            family=${spec%%:*}; n=${spec##*:}
            uv run vtf generate --family $family --n $n --seed 42 --out out/$family | tee generate-$family.log
            uv run vtf pairs out/$family
            uv run vtf photos out/$family
            uv run vtf compare out/$family samples/$family-seed42 | tee -a samples-match.log
          done

      - name: Sample run with pairs and OCR read-back
        run: |
          uv run vtf generate --n 200 --seed 42 --out out/ci | tee generate.log
          uv run vtf pairs out/ci | tee pairs.log
          uv run vtf ocr out/ci | tee ocr.log

      - name: Upload validation logs and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            *.log
            out/ci/summary.json
            out/ci/pairs_summary.json
            out/ci/ocr_summary.json
            out/ci/report.html
