# Settings for: vtf generate --family connections --config configs/connections.yaml
# Every value here matches the built-in default; edit what you want to change and delete the rest.

questions_per_scene: 2   # questions asked about each image (each from a different template)
max_scenes: null         # stop after this many images even if --n isn't reached (default: 5 x n)

templates:
  cable_trace: 1
  cable_trace_back: 1
  valves_reach: 1
  valves_one: 1
  gears_ccw: 1
  gears_same: 1

scene:
  kinds: {cables: 1, gears: 1, valves: 1}
  # Weight of each difficulty level, per kind. Cables: 8 colored, then 8, 16, 24 and 32 in one
  # color. Valves: 4x3, 6x5 and 8x7 networks. Gears: a chain of 5, 9 + 2 loose, 14 + 3 loose.
  levels:
    cables: [1, 1, 1, 1, 1]
    valves: [1, 1, 1]
    gears: [1, 1, 1]
  dpi: 110

validation:
  min_font_px: 9           # smallest text counted as readable
  min_mark_px: 3           # smallest mark (cable, valve, gear) counted as visible
  overlap_tol_px: 1        # overlap allowed between two items before it counts
  clean_text: true         # reject images where any two pieces of text collide
  visual_gap: 0.05         # (charts only)
  max_relative_tolerance: 0.2  # (numbers only)
  min_feature_px: 4        # ports, valves and gaps between gears must be at least this many pixels apart
  dedup_max_hamming: 3     # diagrams of one kind share most pixels: only near-identical images are copies
  determinism_sample: 0.1  # share of images rebuilt from their seed to confirm identical output

balance:
  max_answer_share: 0.35
  max_yes_no_share: 0.55
  warmup: 8
