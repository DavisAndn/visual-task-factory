# Settings for: vtf generate --family counting --config configs/counting.yaml
# Every value here matches the built-in default; edit what you want to change and delete the rest.

questions_per_scene: 1   # one count per scatter plot
max_scenes: null         # stop after this many images even if --n isn't reached (default: 5 x n)

templates:
  count_side: 1

scene:
  # Weight of difficulty levels 1-6: about 30, 70, 150, 300, 515 and 800 points.
  levels: [1, 1, 1, 1, 1, 1]
  dpi: 110

validation:
  min_font_px: 9           # smallest text counted as readable
  min_mark_px: 3           # smallest mark counted as visible
  overlap_tol_px: 1        # overlap allowed between two items before it counts
  clean_text: true         # reject images where any two pieces of text collide
  visual_gap: 0.05         # (charts only)
  max_relative_tolerance: 0.2  # (numbers only)
  min_feature_px: 4        # points must be at least this many pixels apart (they are drawn 6 px apart)
  dedup_max_hamming: 8     # image-hash distance at or below which two images are near-copies
  determinism_sample: 0.1  # share of images rebuilt from their seed to confirm identical output

balance:
  max_answer_share: 0.35
  max_yes_no_share: 0.55
  warmup: 8
