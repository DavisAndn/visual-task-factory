# Settings for: vtf generate --family instruments --config configs/instruments.yaml
# Every value here matches the built-in default; edit what you want to change and delete the rest.

questions_per_scene: 2   # questions asked about each image (each from a different template)
max_scenes: null         # stop after this many images even if --n isn't reached (default: 5 x n)

templates:
  gauge_read: 1
  gauge_read_inner: 1
  gauge_headroom: 0.6
  syringe_read: 1
  syringe_top_up: 0.6
  clock_time: 1
  clock_until: 0.6

scene:
  kinds: {clock: 1, gauge: 1, syringe: 1}
  # Weight of difficulty levels 1-4. Gauges: 2 then 4-5 ticks per label, then psi gauges read on
  # their inner bar scale, coarse then fine. Syringes: 20-60 mL, 5-10 mL, 3 mL or insulin, 1 mL.
  # Clocks: Arabic numerals, Roman numerals, ticks only, ticks only with a second hand.
  levels: [1, 1, 1, 1]
  redline: 0.5             # probability a level-2 gauge has a red zone
  dpi: 110

validation:
  min_font_px: 9           # smallest text counted as readable
  min_mark_px: 3           # smallest mark (needle, hand, stopper) counted as visible
  overlap_tol_px: 1        # overlap allowed between two items before it counts
  clean_text: true         # reject images where any two pieces of text collide
  visual_gap: 0.05         # (charts only)
  max_relative_tolerance: 0.2  # a reading's tolerance must be under this share of the answer
  min_feature_px: 4        # scale ticks must be at least this far apart
  dedup_max_hamming: 3     # instruments differ by a needle or a hand: only near-identical images are copies
  determinism_sample: 0.1  # share of images rebuilt from their seed to confirm identical output

balance:
  max_answer_share: 0.35
  max_yes_no_share: 0.55
  warmup: 8
